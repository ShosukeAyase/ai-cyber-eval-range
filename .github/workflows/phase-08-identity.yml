name: phase-08-identity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Format and lint
        run: python -m ruff format --check . && python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Generate FILE-MANIFEST
        run: git ls-files | LC_ALL=C sort > FILE-MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase-08-file-manifest
          path: FILE-MANIFEST.txt
          if-no-files-found: error
      - name: Compile and validate complete repository
        run: python -m compileall -q src scripts tests && python -m pytest
