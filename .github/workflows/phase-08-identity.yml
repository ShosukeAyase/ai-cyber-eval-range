name: phase-08-identity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify formatting
        run: python -m ruff format --check .
      - name: Generate lint artifact
        run: python -m ruff check . --output-format=json > phase-08-ruff-lint.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: phase-08-ruff-lint
          path: phase-08-ruff-lint.json
          if-no-files-found: error
      - name: Enforce lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Compile and validate complete repository
        run: python -m compileall -q src scripts tests && python -m pytest
