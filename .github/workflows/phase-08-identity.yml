name: phase-08-identity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Format and lint
        run: python -m ruff format --check . && python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Calculate Phase 05 baseline digest variants
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from cyber_eval.range.catalog import hash_tree

          def hash_with_crlf(root: Path) -> str:
              digest = hashlib.sha256()
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  digest.update(path.relative_to(root).as_posix().encode("utf-8"))
                  digest.update(b"\0")
                  data = path.read_bytes().replace(b"\r\n", b"\n").replace(b"\n", b"\r\n")
                  digest.update(data)
              return digest.hexdigest()

          root = Path("range-scenarios")
          report = {}
          for package in sorted(path for path in root.iterdir() if path.is_dir()):
              manifest = json.loads((package / "scenario.json").read_text(encoding="utf-8"))
              synthetic = package / "synthetic"
              report[package.name] = {
                  "declared": manifest["reset"]["baseline_digest"],
                  "actual_lf": f"sha256:{hash_tree(synthetic)}",
                  "candidate_crlf": f"sha256:{hash_with_crlf(synthetic)}",
              }
          Path("phase-05-digests.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase-05-digests
          path: phase-05-digests.json
          if-no-files-found: error
      - name: Generate pytest diagnostics
        run: python -m pytest -q > phase-08-pytest.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: phase-08-pytest
          path: phase-08-pytest.txt
          if-no-files-found: error
      - name: Enforce full repository tests
        run: python -m pytest
