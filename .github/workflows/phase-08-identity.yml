name: phase-08-identity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Diagnose formatter and lint differences
        run: |
          python -m ruff format .
          git diff -- src/cyber_eval/identity tests/architecture/test_phase_08_identity_architecture.py tests/integration/test_phase_08_identity_boundary.py tests/unit/test_phase_08_identity.py
          python -m ruff check .
          git diff --exit-code
      - name: Type check
        run: python -m mypy src
      - name: Compile and validate complete repository
        run: python -m compileall -q src scripts tests && python -m pytest
