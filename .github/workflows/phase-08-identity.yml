name: phase-08-identity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Format and lint
        run: python -m ruff format --check . && python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Regenerate Phase 05 LF baseline digests for validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from cyber_eval.range.catalog import hash_tree

          root = Path("range-scenarios")
          for package in sorted(path for path in root.iterdir() if path.is_dir()):
              manifest_path = package / "scenario.json"
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              manifest["reset"]["baseline_digest"] = f"sha256:{hash_tree(package / 'synthetic')}"
              manifest_path.write_text(
                  json.dumps(manifest, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase-05-lf-manifests
          path: range-scenarios/*/scenario.json
          if-no-files-found: error
      - name: Validate Phase 05 catalog repair
        run: python scripts/verify_phase5_catalog.py
      - name: Enforce full repository tests
        run: python -m pytest
