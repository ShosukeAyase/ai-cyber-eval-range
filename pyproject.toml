[build-system]
requires = ["setuptools>=68,<80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-eval-skeleton"
version = "0.4.0"
description = "Local Control Plane and isolated Runner MVP for an authorized cyber-evaluation platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
  "pytest==9.0.2",
  "ruff==0.12.5",
  "mypy==1.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cyber_eval"]
